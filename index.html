<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>IPTV 高清播放器 - 明亮版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .card {
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .card-header {
            background-color: #007bff;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            padding: 12px 20px;
        }
        .form-control, .form-select {
            background-color: white;
            color: #333;
            border: 1px solid #ced4da;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
            color: white;
        }
        .btn-outline-secondary {
            border-color: #6c757d;
            color: #6c757d;
        }
        .btn-outline-secondary:hover {
            background-color: #6c757d;
            color: white;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 500px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .channels-panel {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .channel-item {
            padding: 10px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            transition: background 0.2s;
        }
        .channel-item:hover {
            background-color: #f8f9fa;
        }
        .channel-item.active {
            background-color: #e3f2fd;
            border-left: 4px solid #007bff;
        }
        .source-item {
            font-size: 0.9em;
            color: #6c757d;
            margin-left: 10px;
        }
        .source-item.active {
            color: #007bff;
            font-weight: bold;
        }
        .proxy-status {
            font-size: 0.85em;
            padding: 5px 10px;
            border-radius: 4px;
            margin-top: 5px;
        }
        .proxy-status.connected {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .proxy-status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            color: #6c757d;
            font-size: 0.9em;
        }
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        .debug-panel {
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
        .debug-entry {
            margin-bottom: 5px;
            padding: 3px 5px;
            border-left: 3px solid transparent;
        }
        .debug-entry.info { border-left-color: #17a2b8; color: #17a2b8; }
        .debug-entry.warning { border-left-color: #ffc107; color: #856404; }
        .debug-entry.error { border-left-color: #dc3545; color: #721c24; }
        .debug-entry.success { border-left-color: #28a745; color: #155724; }
        .debug-timestamp {
            color: #6c757d;
            font-size: 10px;
            margin-right: 10px;
        }
        .local-proxy-config {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            border: 1px dashed #dee2e6;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="text-center mb-4">IPTV 高清播放器</h1>

    <div class="row">
        <!-- 左侧控制区 -->
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header">直播源管理</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="m3u8Url" class="form-label">M3U8 直链播放</label>
                        <input type="text" class="form-control" id="m3u8Url" placeholder="输入 m3u8 链接"/>
                        <button class="btn btn-primary mt-2 w-100" onclick="loadDirectStream()">播放直链</button>
                    </div>

                    <div class="mb-3">
                        <label for="m3uSubscription" class="form-label">M3U 订阅地址</label>
                        <input type="text" class="form-control" id="m3uSubscription" placeholder="输入 M3U 订阅链接"/>
                        <button class="btn btn-primary mt-2 w-100" onclick="loadM3USubscription()">加载订阅</button>
                    </div>

                    <div class="mb-3">
                        <label for="corsProxy" class="form-label">CORS 代理设置</label>
                        <select class="form-select" id="corsProxy">
                            <option value="">不使用代理</option>
                            <option value="http://localhost:3000/proxy?url=" selected>本地代理 (localhost:3000)</option>
                            <option value="https://m3u.521986.xyz/?url=">默认代理: m3u.521986.xyz</option>
                            <option value="https://corsproxy.io/?url=">CorsProxy.io</option>
                            <option value="https://api.allorigins.win/raw?url=">AllOrigins</option>
                        </select>
                        
                        <!-- 本地代理状态显示 -->
                        <div id="localProxyStatus" class="proxy-status disconnected" style="display: none;">
                            <i class="bi bi-circle-fill me-1"></i> 本地代理: 未连接
                        </div>
                        
                        <!-- 本地代理配置 -->
                        <div class="local-proxy-config mt-2">
                            <small class="text-muted">本地代理配置</small>
                            <div class="d-flex mt-1">
                                <input type="text" class="form-control form-control-sm me-2" id="localProxyHost" placeholder="代理主机" value="localhost"/>
                                <input type="number" class="form-control form-control-sm" id="localProxyPort" placeholder="端口" value="3000"/>
                            </div>
                            <button class="btn btn-sm btn-outline-secondary mt-2 w-100" onclick="updateLocalProxy()">更新本地代理</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">频道列表</div>
                <div class="card-body channels-panel" id="channelList">
                    <p class="text-muted">加载订阅或直链后显示频道</p>
                </div>
            </div>
        </div>

        <!-- 右侧播放区 -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">视频播放</div>
                <div class="card-body">
                    <div class="video-container">
                        <video id="video" controls autoplay></video>
                    </div>
                    <div class="mt-3">
                        <h6>当前播放: <span id="currentPlayback" class="text-success">无</span></h6>
                        <div id="sourceSwitcher" class="mt-2"></div>
                    </div>
                </div>
            </div>
            
            <!-- 调试面板 -->
            <div class="card mt-4">
                <div class="card-header">
                    调试信息 
                    <button class="btn btn-sm btn-outline-secondary float-end" onclick="toggleDebugPanel()">隐藏</button>
                </div>
                <div class="card-body">
                    <div class="debug-panel" id="debugLog"></div>
                    <div class="mt-2">
                        <button class="btn btn-sm btn-outline-secondary" onclick="clearDebugLog()">清空日志</button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="testLocalProxy()">测试本地代理</button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="testSimpleStream()">测试简单流</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    IPTV 播放器 &copy; 2025 | 支持 M3U8 直链与订阅源播放
</footer>

<script>
  const video = document.getElementById('videoPlayer');
  const logArea = document.getElementById('debugLog');
  const channelList = document.getElementById('channelList');
  const currentChannelEl = document.getElementById('currentChannel');
  const proxySelect = document.getElementById('proxySelect');
  const proxyStatus = document.getElementById('proxyStatus');
  let hls;

  function log(msg) {
    const time = new Date().toLocaleTimeString();
    logArea.innerHTML += `[${time}] ${msg}<br>`;
    logArea.scrollTop = logArea.scrollHeight;
    console.log(msg);
  }

  function toggleDebug() {
    const debugPanel = document.getElementById('debugLog');
    debugPanel.style.display = debugPanel.style.display === 'none' ? 'block' : 'none';
  }

  function destroyHLS() {
    if (hls) {
      hls.destroy();
      log('HLS实例已销毁');
      hls = null;
    }
  }

  // 获取代理后的 URL
  function getProxiedUrl(url) {
    const proxy = proxySelect.value;
    const encodedUrl = encodeURIComponent(url);
    switch (proxy) {
      case 'local':
        return `http://localhost:3000/proxy?url=${encodedUrl}`;
      case 'default':
        return `https://api.allorigins.win/get?url=${encodedUrl}`;
      case 'corsio':
        return `https://corsproxy.io/?${encodedUrl}`;
      case 'allorigins':
        return `https://api.allorigins.win/get?url=${encodedUrl}`;
      default:
        return url;
    }
  }

  // 播放视频流
  function playUrl(url, name = '未知频道') {
    destroyHLS();
    currentChannelEl.textContent = name;

    // 如果是本地代理，且 URL 不包含 /proxy，则使用代理
    const finalUrl = proxySelect.value === 'local' && !url.includes('/proxy?url=')
      ? getProxiedUrl(url)
      : url;

    log(`开始播放: ${name}`);
    log(`播放URL: ${finalUrl}`);

    if (Hls.isSupported()) {
      hls = new Hls({
        debug: false,
        liveSyncDurationCount: 1,
        maxBufferSize: 60 * 1000 * 1000,
        maxBufferLength: 30
      });

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        log('SUCCESS] 媒体清单解析成功，共 1 个质量级别');
      });

      hls.on(Hls.Events.ERROR, (evt, data) => {
        log(`[ERROR] HLS错误: ${data.type} - ${data.details}`);
        if (data.fatal) {
          if (data.type === 'networkError') {
            log('[WARNING] 网络错误，尝试恢复...');
            hls.startLoad();
          } else if (data.type === 'mediaError') {
            hls.recoverMediaError();
          }
        }
      });

      hls.loadSource(finalUrl);
      hls.attachMedia(video);
      log('SUCCESS] HLS.js初始化完成');
      log('SUCCESS] HLS.js与视频元素绑定成功');
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = finalUrl;
      video.addEventListener('loadedmetadata', () => {
        log('SUCCESS] HLS原生播放开始');
      });
    } else {
      alert('不支持的播放格式');
    }
  }

  // ✅ 修改：加载 M3U 订阅 —— 使用 /m3u 接口处理路径重写
  function loadM3U() {
    const url = document.getElementById('m3uUrl').value.trim();
    if (!url) {
      alert('请输入M3U地址');
      return;
    }

    // ✅ 关键修改：如果使用本地代理，走 /m3u 接口
    let fetchUrl;
    if (proxySelect.value === 'local') {
      fetchUrl = `http://localhost:3000/m3u?url=${encodeURIComponent(url)}`;
      log(`[INFO] 使用本地代理的 /m3u 接口加载订阅: ${fetchUrl}`);
    } else {
      fetchUrl = getProxiedUrl(url);
      log(`[INFO] 使用通用代理加载: ${fetchUrl}`);
    }

    fetch(fetchUrl)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        // ✅ 如果是本地代理，返回的是纯文本 M3U 内容
        return proxySelect.value === 'local' ? res.text() : res.json().then(data => data.contents);
      })
      .then(content => {
        // ✅ 本地代理返回的是已重写的 M3U 文本，无需 decodeURIComponent
        const m3uText = proxySelect.value === 'local' ? content : decodeURIComponent(content);
        parseM3U(m3uText);
      })
      .catch(err => {
        if (err.name === 'TypeError' || err.message.includes('fetch')) {
          testLocalProxy();
          log('[ERROR] 网络请求失败，请检查本地代理是否运行');
          alert('加载订阅失败，请检查代理服务是否运行');
        } else {
          log(`[ERROR] 加载失败: ${err.message}`);
          alert(`加载失败: ${err.message}`);
        }
      });
  }

  // 解析 M3U 内容并生成频道按钮
  function parseM3U(m3uContent) {
    const lines = m3uContent.split('\n');
    const channels = [];
    let name = '未知频道';

    for (const line of lines) {
      const trimmed = line.trim();
      if (trimmed.startsWith('#EXTINF:')) {
        const match = trimmed.match(/,(.+)$/);
        name = match ? match[1].trim() : '未知频道';
      } else if (trimmed && !trimmed.startsWith('#')) {
        channels.push({ name, url: trimmed });
      }
    }

    channelList.innerHTML = '';
    channels.forEach(ch => {
      const a = document.createElement('a');
      a.href = 'javascript:void(0)';
      a.className = 'channel-btn';
      a.textContent = ch.name;
      a.onclick = () => playUrl(ch.url, ch.name);
      channelList.appendChild(a);
    });

    log(`加载完成，共 ${channels.length} 个频道`);
  }

  function playDirect() {
    const url = document.getElementById('m3uUrl').value.trim();
    if (!url) {
      alert('请输入播放地址');
      return;
    }
    playUrl(url, '直链播放');
  }

  function updateLocalProxy() {
    log('[INFO] 本地代理配置更新');
    testLocalProxy();
  }

  function testLocalProxy() {
    fetch('http://localhost:3000/health')
      .then(res => res.json())
      .then(data => {
        proxyStatus.textContent = '本地代理: 已连接 ✔️';
        log('[SUCCESS] 本地代理连接成功: ' + JSON.stringify(data));
      })
      .catch(err => {
        proxyStatus.textContent = '本地代理: 未连接 ❌';
        log('[ERROR] 本地代理无法访问，请确认 server.js 正在运行: ' + err.message);
      });
  }

  function testSimpleStream() {
    const testUrl = 'https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8';
    playUrl(testUrl, '测试流');
  }

  log('IPTV 播放器已加载');
  toggleDebug();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
