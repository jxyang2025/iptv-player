<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>IPTV 高清播放器 - 明亮版</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 20px;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .panel {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      flex: 1;
      min-width: 300px;
    }
    input[type="text"] {
      width: 60%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #0056b3;
    }
    select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #channelList {
      margin: 10px 0;
      min-height: 40px;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      background: #f8f8f8;
      padding: 10px;
      border-radius: 4px;
      color: #333;
    }
    #debugLog {
      background: #000;
      color: #0f0;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      height: 120px;
      overflow-y: auto;
      margin: 0;
      white-space: pre-line;
      line-height: 1.4;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <h1>IPTV 高清播放器 - 明亮版</h1>

  <!-- 左右两列布局 -->
  <div class="container">

    <!-- 左侧：直播源管理 + 频道列表 -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
      
      <div class="panel">
        <h3>IPTV 高清播放器</h3>
        <h3>直播源管理</h3>
        <input type="text" id="m3uUrl" placeholder="请输入M3U8 直链或订阅地址" />
        <button onclick="loadM3U()">加载订阅</button>
        <button onclick="playDirect()">播放直链</button>
        <br>
        <select id="proxySelect">
          <option value="none">不使用代理</option>
          <option value="local" selected>本地代理 (localhost:3000)</option>
          <option value="default">默认代理: m3u.521986.xyz</option>
          <option value="corsio">CorsProxy.io</option>
          <option value="allorigins">AllOrigins</option>
        </select>
        <span id="proxyStatus">本地代理: 未连接</span>
        <button onclick="updateLocalProxy()">更新本地代理</button>
        <button onclick="testLocalProxy()">测试本地代理</button>
        <button onclick="testSimpleStream()">测试简单流</button>
      </div>

      <div class="panel">
        <h3>频道列表</h3>
        <div id="channelList">加载订阅或直链后显示频道</div>
      </div>

    </div>

    <!-- 右侧：视频播放 + 调试信息 -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 20px;">

      <div class="panel">
        <h3>视频播放</h3>
        <p>当前播放: <span id="currentChannel">无</span></p>
        <video id="videoPlayer" controls></video>
      </div>

      <div class="panel">
        <h3>调试信息</h3>
        <button onclick="clearLog()">清空日志</button>
        <button onclick="toggleDebug()">隐藏/显示</button>
        <pre id="debugLog"></pre>
      </div>

    </div>

  </div>

  <div class="footer">
    IPTV 播放器 © 2025 | 支持 M3U8 直链与订阅源播放
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    const logArea = document.getElementById('debugLog');
    const channelList = document.getElementById('channelList');
    const currentChannelEl = document.getElementById('currentChannel');
    const proxySelect = document.getElementById('proxySelect');
    const proxyStatus = document.getElementById('proxyStatus');
    let hls;

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logArea.textContent += `[${time}] ${msg}\n`;
      logArea.scrollTop = logArea.scrollHeight;
      console.log(msg);
    }

    function clearLog() {
      logArea.textContent = '';
    }

    function toggleDebug() {
      if (logArea.style.display === 'none') {
        logArea.style.display = 'block';
      } else {
        logArea.style.display = 'none';
      }
    }

    function destroyHLS() {
      if (hls) {
        hls.destroy();
        log('HLS实例已销毁');
        hls = null;
      }
    }

    function getProxiedUrl(url) {
      const proxy = proxySelect.value;
      const encodedUrl = encodeURIComponent(url);
      switch (proxy) {
        case 'local':
          return `http://localhost:3000/proxy?url=${encodedUrl}`;
        case 'default':
          return `https://api.allorigins.win/get?url=${encodedUrl}`;
        case 'corsio':
          return `https://corsproxy.io/?${encodedUrl}`;
        case 'allorigins':
          return `https://api.allorigins.win/get?url=${encodedUrl}`;
        default:
          return url;
      }
    }

    function playUrl(url, name = '未知频道') {
      destroyHLS();
      currentChannelEl.textContent = name;

      const finalUrl = proxySelect.value === 'local' && !url.includes('/proxy?url=')
        ? getProxiedUrl(url)
        : url;

      log(`开始播放: ${name}`);
      log(`播放URL: ${finalUrl}`);

      if (Hls.isSupported()) {
        hls = new Hls({
          debug: false,
          liveSyncDurationCount: 1,
          maxBufferSize: 60 * 1000 * 1000,
          maxBufferLength: 30
        });

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          log('SUCCESS] 媒体清单解析成功，共 1 个质量级别');
        });

        hls.on(Hls.Events.ERROR, (evt, data) => {
          log(`[ERROR] HLS错误: ${data.type} - ${data.details}`);
          if (data.fatal) {
            if (data.type === 'networkError') {
              log('[WARNING] 网络错误，尝试恢复...');
              hls.startLoad();
            } else if (data.type === 'mediaError') {
              hls.recoverMediaError();
            }
          }
        });

        hls.loadSource(finalUrl);
        hls.attachMedia(video);
        log('SUCCESS] HLS.js初始化完成');
        log('SUCCESS] HLS.js与视频元素绑定成功');
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = finalUrl;
        video.addEventListener('loadedmetadata', () => {
          log('SUCCESS] HLS原生播放开始');
        });
      } else {
        alert('不支持的播放格式');
      }
    }

    function loadM3U() {
      const url = document.getElementById('m3uUrl').value.trim();
      if (!url) {
        alert('请输入M3U地址');
        return;
      }

      let fetchUrl;
      if (proxySelect.value === 'local') {
        fetchUrl = `http://localhost:3000/m3u?url=${encodeURIComponent(url)}`;
        log(`[INFO] 使用本地代理加载订阅: ${fetchUrl}`);
      } else {
        fetchUrl = getProxiedUrl(url);
        log(`[INFO] 使用通用代理加载: ${fetchUrl}`);
      }

      fetch(fetchUrl)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return proxySelect.value === 'local' ? res.text() : res.json().then(data => data.contents);
        })
        .then(content => {
          const m3uText = proxySelect.value === 'local' ? content : decodeURIComponent(content);
          parseM3U(m3uText);
        })
        .catch(err => {
          if (err.name === 'TypeError' || err.message.includes('fetch')) {
            testLocalProxy();
            log('[ERROR] 网络请求失败，请检查本地代理是否运行');
            alert('加载订阅失败，请检查代理服务是否运行');
          } else {
            log(`[ERROR] 加载失败: ${err.message}`);
            alert(`加载失败: ${err.message}`);
          }
        });
    }

    function parseM3U(m3uContent) {
      const lines = m3uContent.split('\n');
      const channels = [];
      let name = '未知频道';

      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith('#EXTINF:')) {
          const match = trimmed.match(/,(.+)$/);
          name = match ? match[1].trim() : '未知频道';
        } else if (trimmed && !trimmed.startsWith('#')) {
          channels.push({ name, url: trimmed });
        }
      }

      // ✅ 改为逐行文本显示，不是按钮
      channelList.innerHTML = '';
      const channelText = channels.map(ch => `${ch.name}: ${ch.url}`).join('\n');
      channelList.textContent = channelText;

      log(`加载完成，共 ${channels.length} 个频道`);
    }

    function playDirect() {
      const url = document.getElementById('m3uUrl').value.trim();
      if (!url) {
        alert('请输入播放地址');
        return;
      }
      playUrl(url, '直链播放');
    }

    function updateLocalProxy() {
      log('[INFO] 本地代理配置更新');
      testLocalProxy();
    }

    function testLocalProxy() {
      fetch('http://localhost:3000/health')
        .then(res => res.json())
        .then(data => {
          proxyStatus.textContent = '本地代理: 已连接 ✔️';
          log('[SUCCESS] 本地代理连接成功: ' + JSON.stringify(data));
        })
        .catch(err => {
          proxyStatus.textContent = '本地代理: 未连接 ❌';
          log('[ERROR] 本地代理无法访问，请确认 server.js 正在运行: ' + err.message);
        });
    }

    function testSimpleStream() {
      const testUrl = 'https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8';
      playUrl(testUrl, '测试流');
    }

    log('IPTV 播放器已加载');
    toggleDebug(); // 默认显示调试信息
  </script>
</body>
</html>
