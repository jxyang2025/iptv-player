<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IPTV 高清播放器 - 明亮版</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #eee;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #fff;
    }
    .panel {
      background: #222;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    input, button, select {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 4px;
    }
    input[type="text"] {
      width: 60%;
      background: #333;
      color: #ddd;
    }
    button {
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #channelList {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }
    .channel {
      padding: 8px 12px;
      background: #333;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .channel:hover {
      background: #007bff;
    }
    video {
      width: 100%;
      max-width: 800px;
      height: auto;
      border-radius: 8px;
      margin: 20px 0;
    }
    #debugLog {
      background: #000;
      color: #0f0;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>IPTV 高清播放器</h1>

    <div class="panel">
      <h3>直播源管理</h3>
      <input type="text" id="m3uUrl" placeholder="输入M3U订阅地址或直链" />
      <button onclick="loadM3U()">加载订阅</button>
      <button onclick="playDirect()">播放直链</button>
    </div>

    <div class="panel">
      <h3>频道列表</h3>
      <div id="channelList">加载订阅或直链后显示频道</div>
    </div>

    <div class="panel">
      <h3>视频播放</h3>
      <p>当前播放: <span id="currentChannel">无</span></p>
      <video id="videoPlayer" controls></video>
    </div>

    <div class="panel">
      <h3>调试信息</h3>
      <button onclick="document.getElementById('debugLog').innerHTML = ''">清空日志</button>
      <button onclick="toggleDebug()">隐藏/显示</button>
      <div id="debugLog"></div>
    </div>
  </div>

  <div class="footer">
    IPTV 播放器 © 2025 | 支持 M3U8 直链与订阅源播放
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    const logArea = document.getElementById('debugLog');
    const channelList = document.getElementById('channelList');
    const currentChannelEl = document.getElementById('currentChannel');
    let hls;

    // 日志函数
    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logArea.innerHTML += `[${time}] ${msg}\n`;
      logArea.scrollTop = logArea.scrollHeight;
      console.log(msg);
    }

    // 切换调试面板显示
    function toggleDebug() {
      logArea.style.display = logArea.style.display === 'none' ? 'block' : 'none';
    }

    // 销毁旧的 HLS 实例
    function destroyHLS() {
      if (hls) {
        hls.destroy();
        log('HLS实例已销毁');
      }
    }

    // 播放指定 URL
    function playUrl(url, name = '未知频道') {
      destroyHLS();
      currentChannelEl.textContent = name;

      if (Hls.isSupported()) {
        hls = new Hls({
          debug: false,
          liveSyncDurationCount: 1,
          maxBufferSize: 60 * 1000 * 1000,
          maxBufferLength: 30
        });

        hls.on(Hls.Events.MANIFEST_PARSED, (evt, data) => {
          log(`媒体清单解析成功，共 ${data.levels.length} 个质量级别`);
        });

        hls.on(Hls.Events.ERROR, (evt, data) => {
          log(`HLS错误: ${data.type} - ${data.details}`);
          if (data.fatal) {
            switch (data.type) {
              case 'networkError':
                log('网络错误，尝试恢复...');
                hls.startLoad();
                break;
              case 'mediaError':
                log('媒体错误，尝试恢复...');
                hls.recoverMediaError();
                break;
              default:
                log('无法恢复的错误');
                break;
            }
          }
        });

        hls.loadSource(url);
        hls.attachMedia(video);
        log(`开始播放: ${name}`);
        log(`播放URL: ${url}`);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
          log(`原生 HLS 播放开始: ${name}`);
        });
      } else {
        alert('不支持的播放格式');
      }
    }

    // 解析 M3U 内容并生成频道列表
    function parseM3U(m3uContent) {
      const lines = m3uContent.split('\n');
      const channels = [];
      let currentName = '未知频道';

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        // 提取频道名
        if (line.startsWith('#EXTINF:')) {
          const match = line.match(/,(.+)$/);
          currentName = match ? match[1].trim() : '未知频道';
        }
        // 提取 URL
        else if (line && !line.startsWith('#')) {
          channels.push({ name: currentName, url: line.trim() });
          currentName = '未知频道'; // 重置
        }
      }

      // 渲染频道列表
      channelList.innerHTML = '';
      channels.forEach(ch => {
        const btn = document.createElement('div');
        btn.className = 'channel';
        btn.textContent = ch.name;
        btn.onclick = () => playUrl(ch.url, ch.name);
        channelList.appendChild(btn);
      });

      log(`加载完成，共 ${channels.length} 个频道`);
    }

    // 加载 M3U 订阅（通过代理）
    function loadM3U() {
      const url = document.getElementById('m3uUrl').value.trim();
      if (!url) {
        alert('请输入M3U地址');
        return;
      }

      const proxyUrl = `http://localhost:3000/m3u?url=${encodeURIComponent(url)}`;
      log(`加载订阅: ${url}`);
      log(`代理地址: ${proxyUrl}`);

      fetch(proxyUrl)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.text();
        })
        .then(m3uText => {
          if (m3uText.trim() === '') throw new Error('返回内容为空');
          parseM3U(m3uText);
        })
        .catch(err => {
          log(`加载失败: ${err.message}`);
          alert('加载订阅失败，请检查地址或代理服务是否运行');
        });
    }

    // 直接播放（也走代理）
    function playDirect() {
      const url = document.getElementById('m3uUrl').value.trim();
      if (!url) {
        alert('请输入播放地址');
        return;
      }

      const proxyUrl = `http://localhost:3000/proxy?url=${encodeURIComponent(url)}`;
      playUrl(proxyUrl, '直链播放');
    }

    // 初始化
    log('IPTV 播放器已加载，准备就绪');
  </script>
</body>
</html>
