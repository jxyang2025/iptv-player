<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>IPTV 播放器 - 修复版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .card {
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .video-container {
            width: 100%;
            height: 500px;
            background-color: #000;
            border-radius: 8px;
        }
        #video {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="text-center mb-4">IPTV 播放器 - 修复版</h1>

    <div class="row">
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">直播源管理</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">M3U8 直链播放</label>
                        <input type="text" class="form-control" id="m3u8Url" 
                               value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"/>
                        <button class="btn btn-primary mt-2 w-100" onclick="loadDirectStream()">播放测试流</button>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">CORS 代理设置</label>
                        <select class="form-select" id="corsProxy">
                            <option value="">不使用代理</option>
                            <option value="https://corsproxy.io/?url=">CorsProxy.io</option>
                            <option value="https://api.allorigins.win/raw?url=">AllOrigins</option>
                            <option value="https://cors-anywhere.herokuapp.com/">Heroku Proxy</option>
                            <option value="https://proxy.scrapping.do/">scrapping.do</option>
                            <option value="https://m3u.521986.xyz/?url=">m3u.521986.xyz</option>
                        </select>
                        <small class="text-muted">如果某个代理失败，请尝试其他选项</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white">视频播放</div>
                <div class="card-body">
                    <div class="video-container">
                        <video id="video" controls autoplay></video>
                    </div>
                    <div class="mt-3">
                        <h6>当前播放: <span id="currentPlayback" class="text-success">准备就绪</span></h6>
                        <div id="status" class="mt-2"></div>
                    </div>
                </div>
            </div>
            
            <div class="card mt-4">
                <div class="card-header bg-info text-white">调试信息</div>
                <div class="card-body">
                    <div id="debugLog" style="height: 150px; overflow-y: auto; font-family: monospace; font-size: 12px;"></div>
                    <button class="btn btn-sm btn-outline-secondary mt-2" onclick="testAllProxies()">测试所有代理</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let hls;
    const video = document.getElementById('video');
// 可用的测试源
const testStreams = [
    "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
    "https://multiplatform-f.akamaihd.net/i/multi/will/bunny/big_buck_bunny_,640x360_400,640x360_700,640x360_1000,950x540_1500,.f4v.csmil/master.m3u8",
    "https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8"
];
    function logDebug(message, type = 'info') {
        const debugLog = document.getElementById('debugLog');
        const timestamp = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.innerHTML = `<span class="text-muted">[${timestamp}]</span> <span class="text-${type}">${message}</span>`;
        debugLog.appendChild(entry);
        debugLog.scrollTop = debugLog.scrollHeight;
        console.log(`[${type}] ${message}`);
    }

    function initHLS() {
        if (hls) hls.destroy();
        
        hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 60
        });
        
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MEDIA_ATTACHED, () => {
            logDebug('HLS.js 初始化成功', 'success');
        });
        
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            logDebug('视频流加载成功', 'success');
            video.play().catch(e => logDebug('自动播放被阻止: ' + e.message, 'warning'));
        });
        
        hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                logDebug(`HLS错误: ${data.type} - ${data.details}`, 'error');
                switch(data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        hls.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        hls.recoverMediaError();
                        break;
                    default:
                        hls.destroy();
                        break;
                }
            }
        });
    }

    function loadDirectStream() {
        const url = document.getElementById('m3u8Url').value.trim();
        const proxy = document.getElementById('corsProxy').value;

        if (!url) {
            alert('请输入URL');
            return;
        }

        const finalUrl = buildProxyUrl(proxy, url);
        logDebug(`播放URL: ${finalUrl}`, 'info');
        
        playStream(finalUrl, "测试流");
    }

    function buildProxyUrl(proxy, url) {
        if (!proxy) return url;
        return proxy + encodeURIComponent(url);
    }

    function playStream(url, label) {
        initHLS();
        document.getElementById('currentPlayback').textContent = label;
        hls.loadSource(url);
    }

    async function testAllProxies() {
        const testUrl = 'https://httpbin.org/get';
        const proxies = [
            {name: '无代理', url: ''},
            {name: 'CorsProxy.io', url: 'https://corsproxy.io/?url='},
            {name: 'AllOrigins', url: 'https://api.allorigins.win/raw?url='},
            {name: 'Heroku', url: 'https://cors-anywhere.herokuapp.com/'},
            {name: 'scrapping.do', url: 'https://proxy.scrapping.do/'},
            {name: 'm3u.521986.xyz', url: 'https://m3u.521986.xyz/?url='}
        ];

        logDebug('开始测试所有代理...', 'info');
        
        for (const proxy of proxies) {
            try {
                const finalUrl = buildProxyUrl(proxy.url, testUrl);
                const response = await fetch(finalUrl, { method: 'HEAD' });
                logDebug(`${proxy.name}: ${response.ok ? '✓ 可用' : '✗ 不可用'} (${response.status})`, 
                         response.ok ? 'success' : 'error');
            } catch (error) {
                logDebug(`${proxy.name}: ✗ 错误 (${error.message})`, 'error');
            }
        }
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        initHLS();
        logDebug('播放器初始化完成', 'success');
        logDebug('点击"播放测试流"测试基本功能', 'info');
    });
    
</script>
</body>
</html>
